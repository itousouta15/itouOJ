name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # CI 用拋棄式資料庫；build 期間的頁面收集只會讀到空資料庫
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      # 從空資料庫套用所有 migration，順便驗證 migration 本身能從零跑完
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Recognition parser self-test
        run: node scripts/parse-reading-bank.mjs --self-test

      - name: CTF beginner challenge tests
        run: npm run test:ctf-beginner

      - name: CTF Web Lab tests
        run: npm run test:ctf-web-labs

      - name: Playground execution tests
        run: npm run test:playground

      - name: Build
        run: npm run build

      - name: CTF integration tests
        env:
          CTF_TEST_PRODUCTION: "1"
        run: npm run test:ctf

      - name: CPE course integration tests
        env:
          CPE_TEST_PRODUCTION: "1"
        run: npm run test:cpe-course

  cpe-programs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4, 5, 6, final]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test loader dependencies
        run: npm ci --ignore-scripts
      - name: Verify CPE reference programs
        env:
          CPE_BATCH: ${{ matrix.batch }}
        run: |
          if [ "$CPE_BATCH" = "final" ]; then
            npm run test:cpe-lessons -- --file final --python python3 --cxx g++
          else
            npm run test:cpe-lessons -- --batch "$CPE_BATCH" --python python3 --cxx g++
          fi
      - name: Verify complete coverage
        if: matrix.batch == 'final'
        run: npm run test:cpe-lessons

  itoulang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - run: npm ci
      - run: npm run build:itoulang
      # Match sandbox-runner's interpreter after installing the app's dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - run: npm run test:itoulang
      - run: npm run package:itoulang
