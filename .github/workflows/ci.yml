name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # CI 用拋棄式資料庫；build 期間的頁面收集只會讀到空資料庫
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      # 從空資料庫套用所有 migration，順便驗證 migration 本身能從零跑完
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Recognition parser self-test
        run: node scripts/parse-reading-bank.mjs --self-test

      - name: CTF beginner challenge tests
        run: npm run test:ctf-beginner

      - name: CTF Web Lab tests
        run: npm run test:ctf-web-labs

      - name: Playground execution tests
        run: npm run test:playground

      - name: Course ordering tests
        run: npm run test:courses

      - name: TOI beginner problem-specific lessons and reference programs
        run: npm run test:toi-beginner-lessons -- --python python3 --cxx g++

      - name: Exact tutorial coverage and source examples
        run: npm run test:tutorial-coverage

      - name: TOI beginner reference programs
        run: npm run test:toi-beginner-programs -- --python python3 --cxx g++
      - name: Bug report tests
        run: npm run test:reports

      - name: Build
        run: npm run build

      - name: CTF integration tests
        env:
          CTF_TEST_PRODUCTION: "1"
        run: npm run test:ctf

      - name: CPE course integration tests
        env:
          CPE_TEST_PRODUCTION: "1"
        run: npm run test:cpe-course

      - name: Course layout integration tests
        env:
          COURSE_LAYOUT_TEST_PRODUCTION: "1"
        run: npm run test:course-layout

      - name: TOI potential course integration tests
        env:
          TOI_POTENTIAL_TEST_PRODUCTION: "1"
        run: npm run test:toi-potential-course

  tutorial-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TOI beginner batch 1
            command: node --import ./scripts/ctf-test-loader.mjs scripts/lib/check-toi-beginner-batch1.mjs --python python3 --cxx g++
          - name: TOI beginner batch 2
            command: python3 scripts/lib/check-toi-beginner-batch2.py --python python3 --cxx g++
          - name: TOI beginner batch 3
            command: python3 scripts/lib/check-toi-beginner-batch3.py --python python3 --cxx g++
          - name: APCS independent checks
            command: node --import ./scripts/ctf-test-loader.mjs scripts/lib/check-apcs-tutorial-audit.mjs --python python3 --cxx g++ --stress
          - name: CPE targeted regressions
            command: node --import ./scripts/ctf-test-loader.mjs scripts/lib/check-cpe-tutorial-audit.mjs --python python3 --cxx g++ --traces
          - name: TOI potential independent checks
            command: node --import ./scripts/ctf-test-loader.mjs scripts/lib/check-toi-potential-tutorial-audit.mjs --regressions --python python3 --cxx g++
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run independent program checks
        run: ${{ matrix.command }}
      - name: Changed CPE public reference programs (targeted, not a bulk matrix)
        if: matrix.name == 'CPE targeted regressions'
        run: npm run test:cpe-lessons -- --code a522,a559,a566,a595,a618,a675,a676,a685,a709,a740,a747,a755,a770,a779,a789,a790,a794,a796,a797,a798,a824,a828,a831,a836,a841 --python python3 --cxx g++

  toi-potential-programs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test loader dependencies
        run: npm ci --ignore-scripts
      - name: Verify TOI potential coverage, reference programs and explicit source-conflict diagnostic
        run: npm run test:toi-potential-lessons -- --python python3 --cxx g++ --check-known-source-conflicts
      - name: TOI potential independent algorithm checks
        run: npm run test:toi-potential-algorithms -- --python python3

  itoulang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - run: npm ci
      - run: npm run build:itoulang
      # Match sandbox-runner's interpreter after installing the app's dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - run: npm run test:itoulang
      - run: npm run package:itoulang
