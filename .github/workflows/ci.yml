name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # CI 用拋棄式資料庫；build 期間的頁面收集只會讀到空資料庫
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      # 從空資料庫套用所有 migration，順便驗證 migration 本身能從零跑完
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: CTF beginner challenge tests
        run: npm run test:ctf-beginner

      - name: CTF Web Lab tests
        run: npm run test:ctf-web-labs

      - name: Playground execution tests
        run: npm run test:playground

      - name: Course ordering tests
        run: npm run test:courses

      - name: Bug report tests
        run: npm run test:reports

      - name: Build
        run: npm run build

      - name: CTF integration tests
        env:
          CTF_TEST_PRODUCTION: "1"
        run: npm run test:ctf

      - name: Course layout integration tests
        env:
          COURSE_LAYOUT_TEST_PRODUCTION: "1"
        run: npm run test:course-layout

  # 後端邏輯測試（服務／主機／部署管理）：原本寫了測試腳本卻沒進 CI。
  # test:problems、test:judge、test:password-reset 目前測試本身已過時或壞掉
  # （例如 mock 了已不存在的 getSession），修好之前先不放進來。
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npx prisma migrate deploy
      - name: Service admin
        if: always()
        run: npm run test:services
      - name: Managed hosts and host agent
        if: always()
        run: npm run test:hosts
      - name: Deployment admin
        if: always()
        run: npm run test:deployment
      - name: Problem management
        if: always()
        run: npm run test:problems
      - name: Judge queue
        if: always()
        run: npm run test:judge
      - name: Password reset
        if: always()
        run: npm run test:password-reset

  itoulang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - run: npm ci
      - run: npm run build:itoulang
      # Match sandbox-runner's interpreter after installing the app's dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - run: npm run test:itoulang
      - run: npm run package:itoulang
