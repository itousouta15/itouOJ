name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # CI 用拋棄式資料庫；build 期間的頁面收集只會讀到空資料庫
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: scripts/ci-step.sh CI-101 npm ci

      - name: Generate Prisma Client
        run: scripts/ci-step.sh CI-102 npm run generate

      # 從空資料庫套用所有 migration，順便驗證 migration 本身能從零跑完
      - name: Apply migrations
        run: scripts/ci-step.sh CI-103 npx prisma migrate deploy

      - name: Type check
        run: scripts/ci-step.sh CI-104 npx tsc --noEmit

      - name: Lint
        run: scripts/ci-step.sh CI-105 npm run lint

      - name: CTF beginner challenge tests
        run: scripts/ci-step.sh CI-111 npm run test:ctf-beginner

      - name: CTF Web Lab tests
        run: scripts/ci-step.sh CI-112 npm run test:ctf-web-labs

      - name: Playground execution tests
        run: scripts/ci-step.sh CI-113 npm run test:playground

      - name: Course ordering tests
        run: scripts/ci-step.sh CI-114 npm run test:courses

      - name: Bug report tests
        run: scripts/ci-step.sh CI-115 npm run test:reports

      - name: Build
        run: scripts/ci-step.sh CI-106 npm run build

      - name: CTF integration tests
        env:
          CTF_TEST_PRODUCTION: "1"
        run: scripts/ci-step.sh CI-116 npm run test:ctf

      - name: Course layout integration tests
        env:
          COURSE_LAYOUT_TEST_PRODUCTION: "1"
        run: scripts/ci-step.sh CI-117 npm run test:course-layout

  # 後端邏輯測試（服務／主機／部署／題目管理／評測佇列／密碼重設）。
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: scripts/ci-step.sh CI-101 npm ci
      - run: scripts/ci-step.sh CI-102 npm run generate
      - run: scripts/ci-step.sh CI-103 npx prisma migrate deploy
      - name: Service admin
        if: always()
        run: scripts/ci-step.sh CI-201 npm run test:services
      - name: Managed hosts and host agent
        if: always()
        run: scripts/ci-step.sh CI-202 npm run test:hosts
      - name: Deployment admin
        if: always()
        run: scripts/ci-step.sh CI-203 npm run test:deployment
      - name: Problem management
        if: always()
        run: scripts/ci-step.sh CI-204 npm run test:problems
      - name: Judge queue
        if: always()
        run: scripts/ci-step.sh CI-205 npm run test:judge
      - name: Password reset
        if: always()
        run: scripts/ci-step.sh CI-206 npm run test:password-reset

  itoulang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: '4.0.23'
      - run: scripts/ci-step.sh CI-101 npm ci
      - run: scripts/ci-step.sh CI-301 npm run build:itoulang
      # Match sandbox-runner's interpreter after installing the app's dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: '20.11.1'
      - run: scripts/ci-step.sh CI-302 npm run test:itoulang
      - run: scripts/ci-step.sh CI-303 npm run package:itoulang
