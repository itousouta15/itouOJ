name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # CI 用拋棄式資料庫；build 期間的頁面收集只會讀到空資料庫
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      # 從空資料庫套用所有 migration，順便驗證 migration 本身能從零跑完
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Recognition parser self-test
        run: node scripts/parse-reading-bank.mjs --self-test

      - name: CTF beginner challenge tests
        run: npm run test:ctf-beginner

      - name: CTF Web Lab tests
        run: npm run test:ctf-web-labs

      - name: Playground execution tests
        run: npm run test:playground

      - name: Course ordering tests
        run: npm run test:courses

      - name: Build
        run: npm run build

      - name: CTF integration tests
        env:
          CTF_TEST_PRODUCTION: "1"
        run: npm run test:ctf

      - name: CPE course integration tests
        env:
          CPE_TEST_PRODUCTION: "1"
        run: npm run test:cpe-course

      - name: Course layout integration tests
        env:
          COURSE_LAYOUT_TEST_PRODUCTION: "1"
        run: npm run test:course-layout

      - name: TOI potential course integration tests
        env:
          TOI_POTENTIAL_TEST_PRODUCTION: "1"
        run: npm run test:toi-potential-course

  toi-potential-programs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test loader dependencies
        run: npm ci --ignore-scripts
      - name: Verify TOI potential coverage, reference programs and explicit source-conflict diagnostic
        run: npm run test:toi-potential-lessons -- --python python3 --cxx g++ --check-known-source-conflicts
      - name: TOI potential independent algorithm checks
        run: npm run test:toi-potential-algorithms -- --python python3

  itoulang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.23'
      - run: npm ci
      - run: npm run build:itoulang
      # Match sandbox-runner's interpreter after installing the app's dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - run: npm run test:itoulang
      - run: npm run package:itoulang
